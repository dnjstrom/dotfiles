set -g default-command /bin/zsh
set -g default-shell /bin/zsh

# Add truecolor support
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g default-terminal "screen-256color"

# Use C-a instead of C-b as prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Use the mouse to select and resize panes and windows
set-option -g mouse on

# Let vim-tmux-focus-events translate tmux focus into FocusGained/FocusLost
set -g focus-events on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

set-window-option -g mode-keys vi

set -g @copy_mode_yank 'Enter'

# New windows/panes open in the current pane's directory, not the session's
# bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Replace the native window picker (choose-tree -Zw) with tmux-fzf's, jumping
# straight to window selection instead of its action menu.
bind w run-shell -b "#{@tmux_fzf_scripts}/window.sh switch"

# Claude Code inside tmux: let notifications/progress bar reach the outer
# terminal, and let tmux distinguish Shift+Enter from plain Enter.
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set-option -g status-position top

# Custom command to quickly reload tmux config
set -s command-alias[100] 'reload=source-file ~/.config/tmux/tmux.conf'
bind r reload

# Proper colors
set-option -sa terminal-features ',alacritty:RGB'

# Undercurl
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-features ",alacritty:usstyle"


# Theming #############################
set -g status-interval 1

set -g pane-border-style fg='brightblack'
set -g pane-active-border-style fg='white'

# Show each pane's current directory in its border, right-aligned, but only
# when the window has multiple panes that aren't all in the same directory
# (a hook toggles pane-border-status per window; see tmux-pane-border.sh).
set -g pane-border-status off
set -g pane-border-format '#[align=right]#{b:pane_current_path} '

set-hook -g session-window-changed 'run-shell "~/.config/tmux/tmux-pane-border.sh #{window_id}"'
set-hook -g client-attached 'run-shell "~/.config/tmux/tmux-pane-border.sh #{window_id}"'
set-hook -g after-select-pane 'run-shell "~/.config/tmux/tmux-pane-border.sh #{window_id}"'
set-hook -g after-select-window 'run-shell "~/.config/tmux/tmux-pane-border.sh #{window_id}"'
set-hook -g after-split-window 'run-shell "~/.config/tmux/tmux-pane-border.sh #{window_id}"'
set-hook -g after-kill-pane 'run-shell "~/.config/tmux/tmux-pane-border.sh #{window_id}"'
# after-kill-pane only fires for an explicit kill-pane command; a pane's
# shell exiting normally (`exit`/Ctrl-D) fires pane-exited instead. Called
# with no argument since pane-exited's #{window_id} isn't reliable (see
# tmux-pane-border.sh).
set-hook -g pane-exited 'run-shell "~/.config/tmux/tmux-pane-border.sh"'
set -g message-style bg='default',fg='default'
set -g status-style bg='default',fg='default'

# A tiny indicator for whether the client_prefix is active or not.
set -g status-left '#[bold]#{?client_prefix,#[bg=default]#[fg=yellow],#[fg=blue]#[bg=default]} 󰘧 #[bg=default]#[fg=default]#[nobold]'

# Rename windows to the current working directory instead of the active command.
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Simply show the windows as their index.
set -g status-justify left
set-window-option -g window-status-style fg='brightblack',bg='default'
set-window-option -g window-status-current-style fg='default',bg='default',bold
set -g window-status-current-format " #I:#W"
set -g window-status-format " #I:#W"
set -g window-status-separator " "

# RAM indicator
set -g status-right '#[fg=cyan]󰍛#{ram_fg_color} #{ram_percentage} '
set -g @ram_percentage_format "%1.0f%%" 

set -g @ram_low_fg_color "#[fg=default]"
set -g @ram_medium_fg_color "#[fg=yellow]"
set -g @ram_high_fg_color "#[fg=red]"

# CPU indicator
set -ga status-right '#[fg=magenta]#{cpu_fg_color} #{cpu_percentage} '
set -g @cpu_percentage_format "%1.0f%%" 

set -g @cpu_low_fg_color "#[fg=default]"
set -g @cpu_medium_fg_color "#[fg=yellow]"
set -g @cpu_high_fg_color "#[fg=red]"

# Battery indicator
set -ga status-right ' #[fg=blue]󱊢#{battery_color_charge_fg}#[bg=default] #{battery_percentage} '
set -g @batt_color_charge_primary_tier8 'default'
set -g @batt_color_charge_primary_tier7 'default'
set -g @batt_color_charge_primary_tier6 'default'
set -g @batt_color_charge_primary_tier5 'default'
set -g @batt_color_charge_primary_tier4 'yellow'
set -g @batt_color_charge_primary_tier3 'yellow'
set -g @batt_color_charge_primary_tier2 'red'
set -g @batt_color_charge_primary_tier1 'red'

# Weekday and time, colored by whether the client_prefix is active for symmetry.
set -ga status-right ' #[fg=green]#[fg=default] %a %b %-d %H:%M '

set -g status on
bind-key b set-option status

#######################################
