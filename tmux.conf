# Prerequisites

# List of plugins
# Install with <prefix>-I 
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-open'



# Use fish shell
set -g default-command /bin/zsh
set -g default-shell /bin/zsh

# Add truecolor support
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g default-terminal "screen-256color"

# Use C-a instead of C-b as prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Use the mouse to select and resize panes and windows
set-option -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

set-window-option -g mode-keys vi

set -g @copy_mode_yank 'Enter'

# pi coding agent preferred settings
# set -g extended-keys on
# set -g extended-keys-format csi-u

set-option -g status-position top

# Custom command to quickly reload tmux config
set -s command-alias[100] 'reload=source-file ~/.tmux.conf'
bind r reload

# Proper colors
set-option -sa terminal-features ',alacritty:RGB'

# Undercurl
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-features ",alacritty:usstyle"


# Theming #############################
set -g status-interval 1

set -g pane-border-style fg='darkgray'
set -g pane-active-border-style fg='white'
set -g message-style bg='default',fg='default'
set -g status-style bg='default',fg='default'

# A tiny indicator for whether the client_prefix is active or not.
set -g status-left ''

# Simply show the windows as their index.
set -g status-justify left
set-window-option -g window-status-style fg='default',bg='default'
set-window-option -g window-status-current-style reverse
set -g window-status-current-format " #W "
set -g window-status-format " #W "

# RAM indicator
set -g status-right '#[fg=cyan]󰍛#{ram_fg_color} #{ram_percentage} '
set -g @ram_percentage_format "%1.0f%%" 

set -g @ram_low_fg_color "#[fg=default]"
set -g @ram_medium_fg_color "#[fg=yellow]"
set -g @ram_high_fg_color "#[fg=red]"

# CPU indicator
set -ga status-right '#[fg=magenta]#{cpu_fg_color} #{cpu_percentage} '
set -g @cpu_percentage_format "%1.0f%%" 

set -g @cpu_low_fg_color "#[fg=default]"
set -g @cpu_medium_fg_color "#[fg=yellow]"
set -g @cpu_high_fg_color "#[fg=red]"

# Battery indicator
set -ga status-right ' #[fg=blue]󱊢#{battery_color_charge_fg}#[bg=default] #{battery_percentage} '
set -g @batt_color_charge_primary_tier8 'default'
set -g @batt_color_charge_primary_tier7 'default'
set -g @batt_color_charge_primary_tier6 'default'
set -g @batt_color_charge_primary_tier5 'default'
set -g @batt_color_charge_primary_tier4 'yellow'
set -g @batt_color_charge_primary_tier3 'yellow'
set -g @batt_color_charge_primary_tier2 'red'
set -g @batt_color_charge_primary_tier1 'red'

# Weekday and time, colored by whether the client_prefix is active for symmetry.
set -ga status-right ' #[fg=green]#[fg=default] %a %b %-d %H:%M '

set -g status on
bind-key b set-option status

#######################################

# Install tmux plugin manager and plugins, if not already available
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm; ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# Press prefix + I (capital I, as in Install) to fetch the plugin.
run -b '~/.tmux/plugins/tpm/tpm'
